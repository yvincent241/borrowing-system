<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Borrowing System</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <div class="container">
    <h1>Borrowing System</h1>
    <section class="card">
      <h2>Login</h2>
      <div id="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Login Tab -->
      <div id="login-tab" class="tab-content">
        <form id="loginForm">
          <label>
            ID Number:
            <input type="text" id="loginIdNumber" placeholder="Enter your ID number" required />
          </label>
          <label>
            Password:
            <input type="password" id="loginPassword" placeholder="Enter your password" required />
          </label>
          <button type="submit">Login</button>
        </form>
        <div id="loginMessage"></div>
      </div>

      <!-- Register Tab -->
      <div id="register-tab" class="tab-content" style="display: none;">
        <form id="registerForm">
          <label>
            Name:
            <input type="text" id="registerName" placeholder="Enter your full name" required />
          </label>
          <label>
            ID Number:
            <input type="text" id="registerIdNumber" placeholder="Enter your ID number" required />
          </label>
          <label>
            Password:
            <input type="password" id="registerPassword" placeholder="Enter a password" required />
          </label>
          <label>
            Confirm Password:
            <input type="password" id="registerConfirm" placeholder="Confirm your password" required />
          </label>
          <button type="submit">Register</button>
        </form>
        <div id="registerMessage"></div>
      </div>
    </section>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
